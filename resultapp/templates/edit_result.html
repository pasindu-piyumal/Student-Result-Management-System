{% extends 'admin_base.html' %}
{% load static %}

{% block content %}

<div class="container">

    <h2 class="mb-4">
        <i class="fas fa-edit"></i>
        Edit Result
    </h2>

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                Edit Student Result
            </h5>
        </div>

        <div class="card-body">

            <div class="row mb-4">

                <div class="col-md-4">
                    <strong>Student:</strong>
                    {{ result.student.name }}
                </div>

                <div class="col-md-4">
                    <strong>Student ID:</strong>
                    {{ result.student.id }}
                </div>

                <div class="col-md-4">
                    <strong>Subject:</strong>
                    {{ result.subject.subject_name }}
                </div>

            </div>


            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label for="marks" class="form-label">
                        <strong>Marks</strong>
                    </label>

                    <input
                        type="number"
                        id="marks"
                        name="marks"
                        class="form-control"
                        value="{{ result.marks }}"
                        min="0"
                        max="100"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-success"
                >
                    <i class="fas fa-save"></i>
                    Update Result
                </button>


                <a
                    href="{% url 'manage_result' %}?class_id={{ result.student_class.id }}"
                    class="btn btn-secondary"
                >
                    <i class="fas fa-arrow-left"></i>
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}

{% extends 'admin_base.html' %}
{% load static %}

{% block content %}

<h2 class="text-dark mb-4">
    <i class="fas fa-tachometer-alt"></i>
    Admin Dashboard
</h2>

<div class="row g-4">

    <!-- Students -->
    <div class="col-md-6 col-lg-3">

        <a href="{% url 'manage_student' %}" class="text-decoration-none">

            <div class="card text-white bg-primary shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <div>
                            <h3>{{ student_count }}</h3>
                            <p class="mb-0">Registered Students</p>
                        </div>

                        <div>
                            <i class="fas fa-users fa-2x"></i>
                        </div>

                    </div>

                </div>

            </div>

        </a>

    </div>


    <!-- Subjects -->
    <div class="col-md-6 col-lg-3">

        <a href="{% url 'manage_subject' %}" class="text-decoration-none">

            <div class="card text-white bg-danger shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <div>
                            <h3>{{ subject_count }}</h3>
                            <p class="mb-0">Subjects Listed</p>
                        </div>

                        <div>
                            <i class="fas fa-book fa-2x"></i>
                        </div>

                    </div>

                </div>

            </div>

        </a>

    </div>


    <!-- Classes -->
    <div class="col-md-6 col-lg-3">

        <a href="{% url 'manage_class' %}" class="text-decoration-none">

            <div class="card text-white bg-warning shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <div>
                            <h3>{{ class_count }}</h3>
                            <p class="mb-0">Classes</p>
                        </div>

                        <div>
                            <i class="fas fa-school fa-2x"></i>
                        </div>

                    </div>

                </div>

            </div>

        </a>

    </div>


    <!-- Results -->
    <div class="col-md-6 col-lg-3">

        <a href="{% url 'manage_result' %}" class="text-decoration-none">

            <div class="card text-white bg-success shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <div>
                            <h3>{{ result_count }}</h3>
                            <p class="mb-0">Results</p>
                        </div>

                        <div>
                            <i class="fas fa-file-signature fa-2x"></i>
                        </div>

                    </div>

                </div>

            </div>

        </a>

    </div>

</div>


<!-- Background -->
<div class="mt-5">

    <img
        src="{% static 'images/background.jpg' %}"
        alt="Admin Background"
        class="img-fluid rounded shadow"
        style="max-height: 400px; width: 100%;"
    >

</div>

{% endblock %}

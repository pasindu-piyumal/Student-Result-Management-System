{% extends 'admin_base.html' %}

{% block content %}

<div class="container">

    <h2 class="mb-4">
        <i class="fas fa-key"></i>
        Change Password
    </h2>


    <!-- Messages -->
    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
                </button>

            </div>

        {% endfor %}

    {% endif %}


    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">
                Change Your Password
            </h5>

        </div>


        <div class="card-body">

            <form method="POST">

                {% csrf_token %}


                <!-- Current Password -->
                <div class="mb-3">

                    <label
                        for="current_password"
                        class="form-label"
                    >
                        Current Password
                    </label>

                    <input
                        type="password"
                        name="current_password"
                        id="current_password"
                        class="form-control"
                        required
                    >

                </div>


                <!-- New Password -->
                <div class="mb-3">

                    <label
                        for="new_password"
                        class="form-label"
                    >
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        id="new_password"
                        class="form-control"
                        minlength="8"
                        required
                    >

                    <small class="text-muted">
                        Password must contain at least 8 characters.
                    </small>

                </div>


                <!-- Confirm Password -->
                <div class="mb-3">

                    <label
                        for="confirm_password"
                        class="form-label"
                    >
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        class="form-control"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-success"
                >
                    <i class="fas fa-save"></i>
                    Change Password
                </button>


                <a
                    href="{% url 'admin_dashboard' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
